version: 2
updates:
  # The hub's web app: React, three.js, shadcn's Radix parts, Vite. Grouped so one PR rebuilds app/ once.
  - package-ecosystem: npm
    directory: /mods/mod-hub/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
